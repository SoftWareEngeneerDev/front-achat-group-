<div class="auth-card">
  <div class="auth-header">
    <h1>Connexion</h1>
    <p>Connectez-vous à votre compte GroupBuy</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="votre@email.com"
        required>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        required>
    </div>

    <div class="form-options">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe">
        <span>Se souvenir de moi</span>
      </label>
      <a routerLink="/auth/forgot-password" class="link">Mot de passe oublié ?</a>
    </div>

    <button type="submit" class="btn btn-primary btn-full" [disabled]="isLoading">
      <span *ngIf="!isLoading">Se connecter</span>
      <span *ngIf="isLoading">Connexion en cours...</span>
    </button>

    <div class="auth-footer">
      <p>Pas encore de compte ? <a routerLink="/auth/register" class="link">S'inscrire</a></p>
    </div>
  </form>
</div>
