<div class="auth-card">
  <div class="auth-header">
    <h1>Mot de passe oublié</h1>
    <p *ngIf="!emailSent">Entrez votre email pour recevoir un lien de réinitialisation</p>
    <p *ngIf="emailSent" class="success-message">
      <i class="fas fa-check-circle"></i>
      Un email a été envoyé à votre adresse
    </p>
  </div>

  <form *ngIf="!emailSent" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="votre@email.com"
        required>
    </div>

    <button type="submit" class="btn btn-primary btn-full" [disabled]="isLoading">
      <span *ngIf="!isLoading">Envoyer le lien</span>
      <span *ngIf="isLoading">Envoi en cours...</span>
    </button>

    <div class="auth-footer">
      <p><a routerLink="/auth/login" class="link">Retour à la connexion</a></p>
    </div>
  </form>

  <div *ngIf="emailSent" class="success-actions">
    <a routerLink="/auth/login" class="btn btn-primary btn-full">Retour à la connexion</a>
  </div>
</div>
