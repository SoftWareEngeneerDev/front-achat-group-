<div class="auth-card">
  <div class="auth-header">
    <h1>Inscription</h1>
    <p>Créez votre compte GroupBuy</p>
  </div>

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-row">
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          [(ngModel)]="firstName"
          placeholder="Jean"
          required>
      </div>

      <div class="form-group">
        <label for="lastName">Nom</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          [(ngModel)]="lastName"
          placeholder="Dupont"
          required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="votre@email.com"
        required>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
        placeholder="••••••••"
        required>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        placeholder="••••••••"
        required>
    </div>

    <label class="checkbox-label">
      <input type="checkbox" [(ngModel)]="acceptTerms" name="acceptTerms">
      <span>J'accepte les <a href="#" class="link">conditions d'utilisation</a></span>
    </label>

    <button type="submit" class="btn btn-primary btn-full" [disabled]="isLoading">
      <span *ngIf="!isLoading">S'inscrire</span>
      <span *ngIf="isLoading">Inscription en cours...</span>
    </button>

    <div class="auth-footer">
      <p>Déjà un compte ? <a routerLink="/auth/login" class="link">Se connecter</a></p>
    </div>
  </form>
</div>
