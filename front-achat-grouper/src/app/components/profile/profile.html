<div class="page-header">
  <div class="container">
    <h1 class="page-title">Mon Profil</h1>
    <p class="page-subtitle">Gérez vos informations personnelles</p>
  </div>
</div>

<div class="container profile-page">
  <div class="profile-card" *ngIf="user">
    <div class="profile-header">
      <div class="profile-avatar">{{ user.firstName.charAt(0) }}{{ user.lastName.charAt(0) }}</div>
      <div class="profile-info">
        <h2>{{ user.firstName }} {{ user.lastName }}</h2>
        <p>{{ user.email }}</p>
      </div>
      <button class="btn btn-primary" (click)="toggleEdit()">
        {{ isEditing ? 'Annuler' : 'Modifier' }}
      </button>
    </div>

    <div class="profile-body">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" [value]="user.firstName" [disabled]="!isEditing">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" [value]="user.lastName" [disabled]="!isEditing">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [value]="user.email" [disabled]="!isEditing">
      </div>
      
      <button *ngIf="isEditing" class="btn btn-primary" (click)="saveProfile()">
        Sauvegarder
      </button>
    </div>
  </div>
</div>
